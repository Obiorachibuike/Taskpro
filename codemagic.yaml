workflows:
  taskpro-android:
    name: TaskPro Android
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      vars:
        EXPO_NO_TELEMETRY: "1"
        CI: "true"
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci --no-audit --no-fund
      - name: Validate application and backend
        script: |
          set -e
          npm run typecheck
          npm run server:typecheck
          npm run lint
          npm run test:coverage
      - name: Generate native Android project
        script: npx expo prebuild --platform android --no-install
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - coverage/lcov.info
      - coverage/coverage-summary.json
